name: Bug report
description: Report a sync, rendering, or app problem.
body:
  - type: markdown
    attributes:
      value: Do not upload private notebooks, exported PDFs, serial numbers, or unredacted logs. Use a new synthetic notebook to reproduce a rendering problem. Report security vulnerabilities privately as described in CONTRIBUTING.md.
  - type: input
    id: version
    attributes:
      label: BOOX Sync version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac model/chip and macOS version
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: BOOX model and firmware version (no serial number)
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or error text
      description: Check attachments for personal information before posting.
